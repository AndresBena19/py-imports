[project]
name = "py_imports"
version = "2.1.0"
description = "Python Toolkit to imports introspection"
authors = [{ name = "Andres", email = "andresbenavides404@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyflakes>=3.0"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/AndresBena19/py-imports"
Changelog = "https://github.com/AndresBena19/py-imports/blob/develop/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_imports"]

[tool.hatch.build.targets.sdist]
include = ["py_imports", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff: replaces flake8, black, isort, pylint (subset) and bandit
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = ["examples", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "S",       # bandit
    "D",       # pydocstyle
    "PL",      # pylint
    "RUF",     # ruff-specific
    "C4",      # comprehensions
    "SIM",     # simplify
    "PT",      # pytest style
]
ignore = [
    "D105",    # magic methods docstrings
    "D107",    # __init__ docstrings (documented on the class)
    "PLR0913", # the import models intentionally take many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["py_imports"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
files = ["py_imports", "tests"]

[[tool.mypy.overrides]]
module = ["pyflakes.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["py_imports"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
